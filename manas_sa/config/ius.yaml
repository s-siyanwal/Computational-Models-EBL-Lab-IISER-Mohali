# IUS regime: Temura Chinmay Krishna Yadav, BS-MS thesis, IISER Mohali, April 2019
# (supervisor N. G. Prasad). "thesis p.X (PDF p.Y)" = printed page (PDF page).
# Grades: established / strongly-supported / promising-but-limited / speculative /
# ours (modelling choice, not biology) / input (taken from a source, never fitted).
regime: IUS
modules:
  quality: true
  choice: true
  harm: false
  telegony: true
parameters:
  # ---------------- Module A: female quality ----------------
  kappa:
    value: 0.0
    provenance: "Fecundity cost of infection. thesis p.23-24 (PDF p.41-42) citing Gupta 2016; Gupta PhD thesis 2016 Table 8.1(e) p.135: infection effect on fecundity F=1.83, p=0.27 (I/U/S, OD 1.5) but measured 96 h post-infection on survivors, not on the 12-14 h choice females. Switch, not a measurement."
    grade: promising-but-limited
  dose:
    value: 1.0
    provenance: "Unit dose standing for OD600 1.5 P. entomophila (thesis p.16). No dose-response curve is used or invented."
    grade: ours
  mortality_96h_U:
    value: 0.8
    provenance: "thesis p.23 (PDF p.41): 'around 70-90 % of the individuals of this population undergoes mortality' at OD600 1.5; midpoint used. Input, not fitted."
    grade: input
  survival_advantage_I:
    value: 0.375
    provenance: "Gupta 2016 p.82 ('a difference of about 35% in the survivorship ... I regime as compared to controls') and p.95 ('an increase of 40% in survivorship'); midpoint. Gupta p.95 also: I females carry about 30% fewer CFUs than S females."
    grade: input
  mortality_96h_sham:
    value: 0.02
    provenance: "thesis p.23: 'almost no mortality at OD600 1.5 on receiving sham-infection'; 0.02 is our stand-in for 'almost no'."
    grade: ours
  F0:
    value: 1.0
    provenance: "Fecundity unit (relative). Quality q = F/F0."
    grade: ours
  cue_on:
    value: true
    provenance: "Male can perceive fecundity. A4 turns it off to separate perception failure from absent fecundity variance (spec section 4.3)."
    grade: ours
  couple_quality_to_survival:
    value: false
    provenance: "Spec 4.1: perceived quality is fecundity, not survival, unless coupling is switched on explicitly."
    grade: ours
  decapitated:
    value: true
    provenance: "thesis p.16 (PDF p.34): females decapitated 12-14 h post-infection to remove receptivity (Spieth 1966). Removes receptivity, not q (spec 4.1)."
    grade: input
  # ---------------- Module A: choice kernel ----------------
  beta0:
    value: 0.59
    provenance: "Softmax sensitivity of a sperm-depleted male, calibrated ONLY on Byrne & Rice 2006 (Proc R Soc B 273:917; measured fecundity 69.30 vs 25.06 offspring, dq = 0.638; 57 of 72 vials with more large females mated by depleted males) via scripts/calibrate_byrne_rice.py; 95% range 0.30-0.88. Replaces the spec-A2-frozen 2.5 (audit docs/07: fitted to a threshold, then adjusted after seeing Khan). The spec value is kept in config/spec_a2.yaml for the A2 compliance check only."
    grade: calibrated-independent
  male_depleted:
    value: true
    provenance: "thesis p.15-16 (PDF p.33-34): males held 12 h with BRB4 sperm-limiter females (Byrne & Rice 2006)."
    grade: input
  depletion_depleted:
    value: 1.0
    provenance: "Spec 4.2: depletion = 1 after the 12 h treatment."
    grade: ours
  depletion_nondepleted:
    value: 0.54
    provenance: "Ratio of non-depleted to depleted sensitivity from the same Byrne & Rice 2006 calibration (0.32 / 0.59; non-depleted: 22 of 32 vials). Non-depleted beta 95% range 0.00-0.76, so weakly identified."
    grade: calibrated-independent
  observation_min:
    value: 30
    provenance: "thesis p.16: each vial observed for a maximum of 30 min."
    grade: input
  interval_min:
    value: 1.0
    provenance: "Courtship scored per 1-min interval, as in Wittman & Fedorka 2015 (J Insect Behav 28:37) methods; Chinmay's scoring resolution is not stated."
    grade: ours
  latency_mean_min:
    value: 2.5
    provenance: "Mean latency to first courtship. Chinmay's CL values are shown only in Figs 3.2-3.3 (MISSING as numbers); Wittman & Fedorka 2015 Table 1 LAT 1.8-3.1 min used for scale."
    grade: ours
  latency_quality_slope:
    value: 0.0
    provenance: "Spec 4.2 says latency declines with max(q1,q2), but independent data do not support a slope: Byrne & Rice 2006 no-choice controls show no consistent effect of female fecundity on mating rate (large vs small 86.7% vs 78.3% mated, n.s.; reversed in the follow-up, 34.6% vs 42.8%). Set to 0 (audit fix); the spec value 0.5 is in config/spec_a2.yaml."
    grade: calibrated-independent
  courting_prob:
    value: 0.8
    provenance: "Probability a minute is spent courting once courtship has begun; Wittman & Fedorka 2015 report ~16 of 20 min courting."
    grade: ours
  persistence:
    value: 0.94
    provenance: "Probability the next courtship minute targets the same female. Calibrated on the per-vial courts-most SD of thesis Table 3.4 BLOCKS 1-2 ONLY (mean SD 0.407); blocks 3-4 (mean SD 0.423) are held out for testing (audit fix: no calibration on scored data)."
    grade: calibrated-heldout
  male_genotype_latency_effect:
    value: 0.0
    provenance: "thesis Table 3.3 (p.21): male genotype F=6.49, p=0.011 but no means or direction given in text (MISSING). Set to 0: allowed intercept, not identified."
    grade: ours
  female_genotype_latency_effect:
    value: 0.0
    provenance: "thesis Table 3.3 (p.21): female genotype F=6.93, p=0.0087; direction/means MISSING. Set to 0: allowed intercept, not identified."
    grade: ours
  postcopulatory_flag:
    value: false
    provenance: "Spec 4.2: copulation duration independent of infection; flag stays off for Chinmay and Khan (Khan & Prasad 2013 p.1019: CD not affected by infection)."
    grade: ours
  # ---------------- Module C: telegony ----------------
  compartmentalization:
    value: true
    provenance: "thesis p.32 (PDF p.50) Discussion: Drosophila female tract compartmentalisation stops seminal fluid acting on immature ovules. Author hypothesis, implemented as a flag; not a measured anatomical result."
    grade: speculative
  semen_effect_sd:
    value: 0.5
    provenance: "Only used when compartmentalization is false (Telostylinus template): Crean, Kopps & Bonduriansky 2014 Ecol Lett 17:1545, offspring ~0.5 SD larger after a high-condition first male (Table 1, P=0.013)."
    grade: strongly-supported
  p2_second_male:
    value: 0.87
    provenance: "Crean et al. 2014: 87% of offspring sired by the second male (Telostylinus). In Chinmay's design scarlet-eyed progeny are second-male (LHst) by eye-colour marker, so paternity does not enter his analysis."
    grade: strongly-supported
  sex_hazard_ratio_male:
    value: 2.0
    provenance: "Sign from thesis Table 4.2 (p.31, PDF p.49): Gender Wald chi2=108.16, p<0.0001, daughters survive better (p.32). Magnitude not reported numerically (Figs 4.1-4.2 only): MISSING; 2.0 is ours."
    grade: ours
  mortality_96h_daughters:
    value: 0.5
    provenance: "Baseline LHst stepdaughter mortality at OD600 1.5; survival curves only in Figs 4.1-4.2 (MISSING as numbers). 0.5 is ours."
    grade: ours
  n_infected_per_cell:
    value: 50
    provenance: "thesis p.29 (PDF p.47): 50 infected individuals per sex per stepfather genotype per treatment."
    grade: input
  n_sham_per_cell:
    value: 30
    provenance: "thesis p.29: 30 sham-infected per sex per stepfather genotype per treatment."
    grade: input
  # ---------------- Module B: harm (Morrow et al. 2003 response) ----------------
  rho:
    value: 0.5
    provenance: "Remating hazard multiplier (1 + rho*eta). Sign rho >= 0 from Morrow, Arnqvist & Pitnick 2003 Behav Ecol 14:802 (harmed D. melanogaster did not delay remating; leg-ablated females remated sooner). Magnitude ours."
    grade: established
  lam:
    value: 0.2
    provenance: "Fecundity multiplier (1 - lambda*eta). Sign lambda >= 0 from Morrow et al. 2003 (no increase in egg laying; D. melanogaster treatment effect on eggs F5,144=2.66, p=0.025, wounded laid fewest). Magnitude ours."
    grade: established
  p2_drosophila:
    value: 0.8
    provenance: "Second-male share of later eggs used by the harm model. Ours; only the sign of harm's effect on the first male's share is scored."
    grade: ours
  r0:
    value: 1.0
    provenance: "Baseline remating hazard (per mean female lifetime unit). Ours; only signs of the harm response are scored."
    grade: ours
  mu_female:
    value: 1.0
    provenance: "Female death rate (time unit = mean lifetime). Ours."
    grade: ours
